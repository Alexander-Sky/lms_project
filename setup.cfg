[flake8]
# PEP 8 советует 79 символов, но в Django-проекте длинные пути и имена
# полей делают перенос хуже, чем длинную строку. 119 — стандарт GitHub:
# столько помещается в окно просмотра кода без горизонтальной прокрутки.
max-line-length = 119
exclude =
    .git,
    .venv,
    venv,
    __pycache__,
    */migrations/*,
    staticfiles,
    media
