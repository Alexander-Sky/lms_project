# Nginx стоит перед Gunicorn и делает то, что Django делает плохо:
# отдаёт статику, держит медленных клиентов и режет слишком большие запросы.

upstream django {
    # web — имя сервиса из docker-compose.prod.yaml, 8000 — порт Gunicorn.
    # Снаружи этот порт закрыт: к нему ходит только Nginx по внутренней сети.
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Больше 10 МБ в запросе не ждём — всё крупнее почти наверняка мусор
    client_max_body_size 10M;

    # Не показываем версию Nginx в заголовках и страницах ошибок
    server_tokens off;

    # Статику отдаёт Nginx напрямую с диска: это в десятки раз быстрее,
    # чем гонять каждый CSS-файл через Python
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://django;

        # Без этих заголовков Django видит все запросы как пришедшие
        # от самого Nginx: не знает ни настоящего IP клиента, ни хоста
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
